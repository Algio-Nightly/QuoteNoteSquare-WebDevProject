<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoteNote^2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="popup hidden">Hello this is a popup</div>
    <div class="main-cont">
        <div class="heading-box">
            <h1>QuoteNote^2</h1>
        </div>
        <div class="text-cont">
            <div class="text-area">
                <textarea class="title-area" placeholder="Title"></textarea>
                <textarea class="content-area" placeholder="Enter Text Here"></textarea>
            </div>
            <div class="option-box">
                <div class="button copy">
                    <img class="icons" src="assets/icons/copy.png" alt="Copy">         
                </div> 
                <div class="button paste">
                    <img class="icons" src="assets/icons/paste.png" alt="Paste">
                </div>
                <div class="button speech">
                    <img class="icons" src="assets/icons/microphone.png" alt="Speech"> 
                </div>
                <div class="button save">
                    <img class="icons" src="assets/icons/save.png" alt="Save">
                </div>
                <div class="button speaker">
                    <img class="icons" src="assets/icons/speaker.png" alt="Speaker">
                </div>
            </div>
        </div>
    </div>
    
    <div class="notes-cont">
        <div class="heading-box">
            <h1>My QuoteNotes</h1>
        </div>
        <div class="notes-box">
            <!-- Note Template -->
            <!-- <div class="note"> 
                <div class="note-title">Helo</div>
                <div class="note-content">HEllo</div>
                <div class="button delete">
                    <img class="icons" src="assets/icons/delete.png" alt="Delete">
                </div>
            </div> -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
